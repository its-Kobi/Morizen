[package]
name = "morizen-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Morizen's native Android application"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["touch-controls"]
touch-controls = []
audio = []
controllers = []
java-mods = []

[dependencies]
horizon-client = { path = "../horizon-client", default-features = false, features = ["android-game", "touch-controls"] }
horizon-protocol = { path = "../horizon-protocol" }
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
ureq = { version = "2", features = ["tls"], default-features = false }
wgpu = { version = "30.0.1", default-features = false }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "android-native-activity"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[package.metadata.android]
package = "com.morizen.app"
build_targets = ["aarch64-linux-android"]
apk_name = "morizen-android-arm64"
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

# Reading a prepared 26.3 folder the player copied into Download or an older app's data. Android
# 11+ hides those from ordinary apps; the player grants "All files access" in Settings once.
[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_feature]]
name = "android.hardware.touchscreen"
required = true

[[package.metadata.android.uses_feature]]
name = "android.hardware.vulkan.level"
required = true
version = 1

[package.metadata.android.application]
label = "Morizen 26.3 Rust"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
orientation = "landscape"
resizeable_activity = false
exported = true

[lints]
workspace = true
