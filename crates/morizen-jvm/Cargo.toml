[package]
name = "morizen-jvm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Embedded JVM host for Morizen's opt-in Java mod bridge"

[dependencies]
jni = { version = "=0.22.4", features = ["invocation"] }
morizen-compat = { path = "../morizen-compat" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_LibraryLoader"] }

[lints]
workspace = true
