name: Morizen launcher

# Morizen publishes only its launcher. The game itself is downloaded from the signed releases of
# horizon-rust/horizon; no game executable is built or put in this release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            archive: morizen-launcher-windows-x64.zip
            binary: horizon-launcher.exe
            rustflags: -C target-feature=+crt-static
          - name: linux-x64
            os: ubuntu-22.04
            archive: morizen-launcher-linux-x86_64.tar.gz
            binary: horizon-launcher
            rustflags: ''
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      # The fixed release tag cannot identify its contents, so the launcher and release notes both
      # carry the commit id. Future launchers compare it when checking for an update.
      HORIZON_LAUNCHER_BUILD: ${{ github.sha }}
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: morizen-launcher-${{ matrix.name }}
          workspaces: launcher
      - name: Linux libraries GPUI links to
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev
      - name: Check formatting
        run: cargo fmt --check
      - name: Test the launcher
        run: cargo test --locked --lib
      - name: Build the launcher
        run: cargo build --release --locked
      - name: Package Windows launcher only
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: |
          $app = "dist/morizen-launcher-windows-x64"
          New-Item -ItemType Directory -Force -Path $app | Out-Null
          Copy-Item launcher/target/release/horizon-launcher.exe $app
          @'
          Morizen launcher for Windows
          ============================

          Start horizon-launcher.exe. Game versions are the official signed Horizon Rust builds
          from horizon-rust/horizon. Open Mods in the launcher to add or remove reviewed projects
          from https://playhorizon.dev/mods without downloading files by hand.

          This archive contains the launcher only; it does not bundle the game.
          '@ | Set-Content "$app/README.txt" -Encoding utf8
          Compress-Archive -Path "$app/*" -DestinationPath "dist/${{ matrix.archive }}" -CompressionLevel Optimal
      - name: Package Linux launcher only
        if: runner.os == 'Linux'
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          app=dist/morizen-launcher-linux-x86_64
          mkdir -p "$app"
          cp launcher/target/release/horizon-launcher "$app/"
          cat > "$app/README.txt" <<'EOF'
          Morizen launcher for Linux
          ==========================

          Run ./horizon-launcher. Game versions are the official signed Horizon Rust builds from
          horizon-rust/horizon. Open Mods in the launcher to add or remove reviewed projects from
          https://playhorizon.dev/mods without downloading files by hand.

          This archive contains the launcher only; it does not bundle the game.
          EOF
          tar -C "$app" -czf "dist/${{ matrix.archive }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: morizen-launcher-*
          path: dist
          merge-multiple: true
      - name: Sign the launchers
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: bash tools/ci/sign_release.sh release-launcher dist/morizen-launcher-*
      - name: Publish release-launcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/launcher-notes.md" <<'EOF'
          # **This is the one you install.**

          Choose your system:

          - **Windows x64:** `morizen-launcher-windows-x64.zip`
          - **Linux x64:** `morizen-launcher-linux-x86_64.tar.gz`

          Unpack the archive and start `horizon-launcher.exe` on Windows or
          `./horizon-launcher` on Linux.

          - Minecraft Rust game versions come from the original, signed
            [`horizon-rust/horizon`](https://github.com/horizon-rust/horizon/releases) releases.
          - Morizen launcher updates come from this release.
          - The **Mods** page installs and removes reviewed projects from the official
            [Horizon mods catalogue](https://playhorizon.dev/mods) inside the launcher.
          - Modrinth and CurseForge are not offered.

          Each archive contains **only the launcher**, not the game.
          EOF
          printf '\n<!-- morizen-build: %s -->\n' "$GITHUB_SHA" >> "$RUNNER_TEMP/launcher-notes.md"
          if gh release view release-launcher > /dev/null 2>&1; then
            gh release edit release-launcher \
              --title "Morizen launcher - install this one" \
              --notes-file "$RUNNER_TEMP/launcher-notes.md" --latest
          else
            gh release create release-launcher \
              --title "Morizen launcher - install this one" \
              --notes-file "$RUNNER_TEMP/launcher-notes.md" --latest
          fi
          gh release upload release-launcher \
            dist/morizen-launcher-windows-x64.zip \
            dist/morizen-launcher-linux-x86_64.tar.gz \
            dist/SHA256SUMS dist/SHA256SUMS.sig --clobber
          # The numbered release is the one people link to; the Android workflow adds the APK
          # to the same tag (`v<version>`) when its build finishes.
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' launcher/Cargo.toml | head -n1)
          tag="v$version"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            cat > "$RUNNER_TEMP/version-notes.md" <<EOF
          # Morizen $version

          The stable Morizen release.

          - **Windows x64:** \`morizen-launcher-windows-x64.zip\`
          - **Linux x64:** \`morizen-launcher-linux-x86_64.tar.gz\`
          - **Android arm64:** \`morizen-android-arm64.apk\` (built by the Android workflow and
            attached to this release)

          The launcher installs the game itself: Minecraft Rust builds come from the signed
          releases of [\`horizon-rust/horizon\`](https://github.com/horizon-rust/horizon).
          Each launcher archive contains the launcher only, not the game. The Android app
          ships no Mojang file either: it downloads Minecraft 26.3 from Mojang on the device.
          EOF
            gh release create "$tag" --title "Morizen $version" \
              --notes-file "$RUNNER_TEMP/version-notes.md"
          fi
          gh release upload "$tag" \
            dist/morizen-launcher-windows-x64.zip \
            dist/morizen-launcher-linux-x86_64.tar.gz \
            dist/SHA256SUMS dist/SHA256SUMS.sig --clobber
