name: java mod bridge
# Builds the opt-in Java bridge on its branch, so a Windows binary can be downloaded
# from the run instead of built locally. Not a release and not a main check: the
# feature stays off in every other build (`docs/java-mod-bridge.md`).
on:
  push:
    branches: [feature/java-mod-bridge]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: java-mod-bridge-windows
      - name: Check formatting
        run: cargo fmt --check
      - name: Test the bridge's Rust side
        run: cargo test --locked -p morizen-compat
      - name: Build the game with the Java bridge
        run: cargo build --profile fast --locked -p horizon-client --bin horizon-client --bin horizon-ctl --features java-mods
      - name: Upload the Windows build
        uses: actions/upload-artifact@v4
        with:
          name: morizen-java-mods-windows-x64
          path: |
            target/fast/horizon-client.exe
            target/fast/horizon-ctl.exe
          if-no-files-found: error
          retention-days: 14
